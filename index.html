<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre Banque | Prototype</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07111f;
  --panel:#0d1b2e;
  --panel2:#101f34;
  --gold:#d8ad55;
  --gold2:#f0cc7a;
  --text:#f5f5f5;
  --muted:#8e9aaa;
  --border:rgba(255,255,255,.09);
  --green:#43d19e;
  --red:#ff7272;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 80% 10%,rgba(216,173,85,.10),transparent 30%),
    radial-gradient(circle at 10% 80%,rgba(20,90,150,.12),transparent 35%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.demo-bar{
  background:#e7b83f;
  color:#111;
  text-align:center;
  padding:8px 12px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.4px;
}

/* NAVIGATION */

nav{
  height:80px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:rgba(7,17,31,.75);
  backdrop-filter:blur(15px);
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:23px;
  font-weight:800;
  letter-spacing:-.7px;
}

.logo span{
  color:var(--gold2);
}

.logo small{
  display:block;
  font-size:8px;
  letter-spacing:2px;
  color:var(--muted);
  margin-top:3px;
}

.nav-actions{
  display:flex;
  gap:10px;
}

.btn{
  border:1px solid var(--border);
  background:rgba(255,255,255,.04);
  color:white;
  padding:11px 17px;
  border-radius:12px;
  transition:.2s;
}
